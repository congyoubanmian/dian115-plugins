[package]
name = "music-plugin"
version = "0.3.0"
edition = "2021"
publish = false

# 宿主按 runtime/plugin.wasm 装载, 产物名必须是 plugin.wasm。
# rlib 仅供本机 `cargo test` 链接使用(wasm 产物仍只有 cdylib), 不影响体积。
[lib]
name = "plugin"
crate-type = ["cdylib", "rlib"]
# 没有 doc test: 纯 wasm 入口 crate, 避免 cargo test 为 doctest 再链一份。
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }
# `raw_value`: 存储信封解包只取两个 `&RawValue` 字段(Go `json.RawMessage` 的等价物),
# 不为大状态文档建 serde_json::Value 树(见 store.rs 的 `unwrap_value`)。
serde_json = { version = "1", features = ["raw_value"] }
# 存储层: host.call 的 body_base64 编解码(Go `encoding/base64` 的 RawStd/Std 两种 padding)。
base64 = "0.22"
# 网易云 eapi 参数加密(Go `netease.go:18` aesECBEncrypt: AES-ECB + PKCS#7)与
# 宿主 host.call 的凭据加解密: `aes` 提供分组密码, `ecb` 提供 ECB 模式, `cbc` 供后续
# Cookie/凭据类 CBC 场景; `aes::cipher` 就是 cipher 0.4。
aes = "0.8"
ecb = "0.1"
cbc = "0.1"
# eapi 摘要(Go `crypto/md5`)。
md-5 = "0.10"
# Go `encoding/hex`: eapi 明文/密文的十六进制编码。
hex = "0.4"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
strip = true
