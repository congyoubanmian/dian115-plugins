name: CI

# push 到 main 与所有 pull_request 跑：单测 → 官方审查闸门 → 构建/打包 → 产物一致性
# → 密钥扫描 → 市场索引校验。
#
# 正式发布不在本工作流：正式包是宿主「编译 MCP」签出的 protected-v4 包，需要可达的
# DIAN115 实例与系统 OpenAPI Key，CI 拿不到；走 scripts/release-v3-local.sh（本地）。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: 离线单测（v3/tests）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 三个插件的 node:test 用例
        run: bash scripts/v3-test.sh

  build-and-audit:
    name: 构建 + 官方审查闸门 + 打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: v3-ui/package-lock.json

      - name: 拉取宿主 v3 开发套件（conformance/audit/market-check）
        run: bash scripts/fetch-v3-kit.sh

      - name: 安装 UI 依赖（npm ci，严格按入库锁文件）
        working-directory: v3-ui
        run: npm ci

      # v3-build.sh：构建 Vue 界面 → 官方结构检查 + 恶意特征扫描（critical/high 必须在
      # scripts/v3-audit-allowlist.json 登记误报理由）→ project-check → pack → 查包。
      - name: 构建 + 审查 + 打包
        run: bash scripts/v3-build.sh

      # 产物是入库的：重建结果必须与 git 里的版本一致，否则说明源码改了没重建。
      - name: 校验 UI 产物可复现（重建结果 == 入库版本）
        run: bash scripts/v3-verify-ui-artifacts.sh

  secret-scan:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 开发者凭据只允许存在于 .env.local（已 gitignore）或 CI secret；
      # 本地 .env.local 不在 CI 里，扫描照样能发现硬编码的凭据形态。
      - name: 跟踪文件里不得有开发者凭据
        run: node scripts/v3-secret-scan.mjs

  market-index:
    name: 市场索引校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 拉取宿主 v3 开发套件
        run: bash scripts/fetch-v3-kit.sh

      - name: 自托管索引（v3-market-index.json）
        run: node v3-kit/conformance/market-check.mjs v3-market-index.json

      - name: 市场索引副本（plugin-market/v3/index.json）
        run: node v3-kit/conformance/market-check.mjs plugin-market/v3/index.json

      # 商店 PR 素材：只产索引条目与图标，不产包/密钥/源码。
      - name: 生成并校验商店 PR 素材
        run: |
          node scripts/v3-store-pr.mjs
          node v3-kit/conformance/market-check.mjs store-pr/index.json
