name: CI

# push 到 main 与所有 pull_request 跑测试/构建/契约检查。
# 标签发布仍由 release-*.yml 负责，本工作流不监听 tag。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: rust tests (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [chase-rs, douban-rs, music-rs]
    steps:
      - uses: actions/checkout@v4

      # 与 release 构建一致，在 rust:1-slim（按 digest 固定，见下方镜像引用）容器内跑
      # 测试，避免 runner 上的 Rust 版本漂移。
      # 挂载仓库根而不是单个插件目录: 三个插件都以 path 依赖引用 plugins/common。
      - name: cargo test（${{ matrix.plugin }}）
        run: docker run --rm -v "$PWD:/src" -w "/src/plugins/${{ matrix.plugin }}" rust@sha256:4df2ae8cfdfebdfc13a65da7f253b73d68983dc0339f2719bc17a279c913b13d cargo test

  common:
    name: rust common
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # common 是 path 依赖，cargo clippy 默认只 lint 当前包；这里单独跑
      # --all-features 覆盖 chase-rs 用的 ext 面。
      - name: cargo test + fmt + clippy（common）
        run: |
          docker run --rm -v "$PWD:/src" -w /src/plugins/common rust@sha256:4df2ae8cfdfebdfc13a65da7f253b73d68983dc0339f2719bc17a279c913b13d \
            sh -c 'rustup component add rustfmt clippy && cargo test --all-features && cargo fmt --check && cargo clippy --all-targets --all-features -- -D warnings'

  lint:
    name: rust lint (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [chase-rs, douban-rs, music-rs]
    steps:
      - uses: actions/checkout@v4

      - name: cargo fmt + clippy（${{ matrix.plugin }}）
        run: |
          docker run --rm -v "$PWD:/src" -w "/src/plugins/${{ matrix.plugin }}" rust@sha256:4df2ae8cfdfebdfc13a65da7f253b73d68983dc0339f2719bc17a279c913b13d \
            sh -c 'rustup component add rustfmt clippy && cargo fmt --check && cargo clippy --all-targets -- -D warnings'

  frontend:
    name: frontend (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: music-rs
            directory: plugins/music-rs
            command: node build-ui.mjs --check
          - plugin: chase-rs
            directory: plugins/chase-rs/frontend
            command: npm run build:ui
          - plugin: douban-center
            directory: plugins/douban-center
            command: npm run build:ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            plugins/music-rs/package-lock.json
            plugins/chase-rs/frontend/package-lock.json
            plugins/douban-center/package-lock.json

      - name: 安装依赖（${{ matrix.plugin }}）
        working-directory: ${{ matrix.directory }}
        run: npm ci

      # music-rs 只做确定性检查；chase-rs 与 douban-center 做完整 UI 构建。
      - name: 构建/检查 UI（${{ matrix.plugin }}）
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.command }}

  conformance:
    name: conformance
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [chase-rs, douban-rs, music-rs]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 遍历全部 plugins/*，按 vendored market-index.schema.json 校验发布时
      # 实际生成的条目（含 manifest.permissions 的 schema 兼容性），并核对
      # runtime/package_url。模板 version 按发版流程用 manifest.version 归一化。
      - name: 市场模板一致性检查
        run: node tools/check-market-templates.mjs

      - name: 市场模板检查回归测试
        run: node --test tools/check-market-templates.test.mjs

      - name: project-check（${{ matrix.plugin }}）
        working-directory: plugins/${{ matrix.plugin }}
        run: node ../../tools/conformance/project-check.mjs

      - name: 公共接口面检查
        run: node tools/conformance/verify-public-surface.mjs

      - name: OpenAPI 契约检查
        run: node tools/conformance/openapi-check.mjs
