name: 发布通知机器人插件

on:
  push:
    tags:
      - 'notify-bot-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/notify-bot
    steps:
      - uses: actions/checkout@v4
        with:
          # 标签发布必须构建标签指向的提交，不能偷偷改为 main；否则先推 tag、后推 main
          # 时会把旧 manifest 打包到新版本 Release。
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }

      - name: 校验标签与清单版本一致
        run: |
          VERSION=$(node -p "require('./manifest.template.json').version")
          EXPECTED_TAG="notify-bot-v$VERSION"
          echo "tag=${{ github.ref_name }} manifest=$VERSION expected=$EXPECTED_TAG"
          [ "${{ github.ref_name }}" = "$EXPECTED_TAG" ] || {
            echo "::error::标签与 manifest 版本不一致，应为 $EXPECTED_TAG"
            exit 1
          }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE=notify.bot-$VERSION.d115p" >> "$GITHUB_ENV"

      - name: 安装依赖
        run: npm ci

      - name: 构建（前端 + WASM）
        run: npm run build

      - name: 构建后一致性检查
        run: npm run check

      - name: 写入签名私钥
        env:
          SIGNING_KEY: ${{ secrets.DIAN115_PLUGIN_SIGNING_KEY }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "::error::未配置 Secrets.DIAN115_PLUGIN_SIGNING_KEY"; exit 1; }
          mkdir -p "$RUNNER_TEMP/dian115"
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/dian115/publisher.pem"

      - name: 打包并签名
        env:
          DIAN115_PLUGIN_SIGNING_KEY: ${{ runner.temp }}/dian115/publisher.pem
        run: npm run package

      - name: 生成市场索引
        run: npm run market -- --repo="https://github.com/${{ github.repository }}" --tag="${{ github.ref_name }}"

      - name: 创建 Release 并上传插件包
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          test -f "plugins/notify-bot/releases/$PACKAGE" || {
            echo "::error::缺少预期包 $PACKAGE"
            ls -la plugins/notify-bot/releases || true
            exit 1
          }
          gh release create "$TAG" "plugins/notify-bot/releases/$PACKAGE" \
            --title "$TAG" \
            --notes "自动构建发布（通知机器人插件：企业微信 / 飞书 / Server酱 / QQ，多配置 + 代理中转）。
          安装：DIAN115 插件中心 → 添加插件仓库 → https://github.com/${{ github.repository }}" \
            || gh release upload "$TAG" "plugins/notify-bot/releases/$PACKAGE" --clobber

      - name: 回写市场索引到 main
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 保留 tag 构建的签名条目和图标；不从 main 的 manifest 重新生成。
          export SNAPSHOT="$RUNNER_TEMP/notify-bot-market"
          export MAIN_WORKTREE="$RUNNER_TEMP/notify-bot-main"
          mkdir -p "$SNAPSHOT"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const index = JSON.parse(readFileSync('plugin-market/index.json', 'utf8'))
          const entries = index.plugins.filter(p => p.id === 'notify.bot')
          if (entries.length !== 1) throw new Error('Expected exactly one notify.bot entry')
          writeFileSync(`${process.env.SNAPSHOT}/entry.json`, JSON.stringify(entries[0]))
          NODE
          cp plugin-market/icons/notify.bot.svg "$SNAPSHOT/notify.bot.svg"
          # 独立 worktree 避免 tag 工作区生成的 tracked 文件阻止 checkout。
          git fetch origin main
          git worktree add --detach "$MAIN_WORKTREE" origin/main
          trap 'git worktree remove --force "$MAIN_WORKTREE"' EXIT
          for attempt in 1 2 3; do
            git fetch origin main
            git -C "$MAIN_WORKTREE" reset --hard origin/main
            node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = `${process.env.MAIN_WORKTREE}/plugin-market/index.json`
          const index = JSON.parse(readFileSync(path, 'utf8'))
          if (!Array.isArray(index.plugins)) throw new Error('Invalid main market index')
          const entry = JSON.parse(readFileSync(`${process.env.SNAPSHOT}/entry.json`, 'utf8'))
          const position = index.plugins.findIndex(p => p.id === 'notify.bot')
          index.plugins = index.plugins.filter(p => p.id !== 'notify.bot')
          index.plugins.splice(position < 0 ? index.plugins.length : position, 0, entry)
          writeFileSync(path, `${JSON.stringify(index, null, 2)}\n`)
          NODE
            mkdir -p "$MAIN_WORKTREE/plugin-market/icons"
            cp "$SNAPSHOT/notify.bot.svg" "$MAIN_WORKTREE/plugin-market/icons/notify.bot.svg"
            git -C "$MAIN_WORKTREE" add plugin-market/index.json plugin-market/icons/notify.bot.svg
            if git -C "$MAIN_WORKTREE" diff --cached --quiet; then
              echo "索引无变化"
              exit 0
            fi
            git -C "$MAIN_WORKTREE" commit -m "chore: 更新通知机器人插件市场索引 $VERSION [skip ci]"
            if git -C "$MAIN_WORKTREE" push origin HEAD:main; then
              exit 0
            fi
            # 并发更新 main 时重新基于最新索引合并，不重放旧的整份索引。
            echo "推送失败，准备重试 ($attempt/3)"
          done
          echo "::error::三次推送均失败，市场索引尚未更新"
          exit 1
