name: 发布音乐下载 Rust 版插件

# 推一个 music-rs-v<版本> 标签即自动: 本插件 npm ci → build-ui.mjs 构建前端 →
# rust:1-slim（按 digest 固定）容器编译 WASM → 打包签名 →
# 生成市场索引(新增 music.rs 条目, 保留 douban.center/douban.rs/chase.rs) →
# 创建 Release 并上传 .d115p → 把索引回写到 main。
#
# 前置: 仓库 Secrets 里配置 DIAN115_PLUGIN_SIGNING_KEY（插件签名私钥的 PEM 全文）。

on:
  push:
    tags:
      - 'music-rs-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（需与插件版本一致，例如 music-rs-v0.3.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/music-rs
    steps:
      - uses: actions/checkout@v7
        with:
          # 必须构建标签指向的提交: tag 先于 main 到达时 main 上还是旧 manifest,
          # 版本校验会失败。dispatch 时用输入的 tag。
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 下方 npm ci 在 plugins/music-rs（defaults.run.working-directory）里执行。
          cache: npm
          cache-dependency-path: plugins/music-rs/package-lock.json

      - name: 校验标签与清单版本一致
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION=$(node -p "require('./manifest.template.json').version")
          EXPECTED_TAG="music-rs-v$VERSION"
          echo "tag=$TAG manifest=$VERSION expected=$EXPECTED_TAG"
          [ "$TAG" = "$EXPECTED_TAG" ] || {
            echo "::error::标签与 manifest 版本不一致（应为 $EXPECTED_TAG）"
            exit 1
          }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE=music.rs-$VERSION.d115p" >> "$GITHUB_ENV"

      - name: 发布前契约预检
        working-directory: .
        run: |
          set -euo pipefail
          node --test tools/plugin-tools/package-limits.test.mjs
          node --test tools/conformance/runtime-check.test.mjs
          node tools/conformance/verify-public-surface.mjs
          node tools/conformance/openapi-check.mjs
          node tools/check-market-templates.mjs

      # 前端依赖由本插件自己的 package.json / package-lock.json 提供。
      - name: 安装 UI 依赖（music-rs）
        run: npm ci

      - name: 构建前端产物（build-ui.mjs）
        run: node build-ui.mjs

      - name: 确认前端产物存在
        run: |
          test -f frontend/dist/assets/remoteEntry.js || {
            echo "::error::缺少前端产物 plugins/music-rs/frontend/dist/assets/remoteEntry.js"
            exit 1
          }

      - name: 构建 WASM 运行时（rust:1-slim 按 digest 固定）
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src/plugins/music-rs \
            -e CARGO_TERM_COLOR=always \
            rust@sha256:4df2ae8cfdfebdfc13a65da7f253b73d68983dc0339f2719bc17a279c913b13d \
            sh -c 'set -e; rustup target list --installed | grep -qx wasm32-unknown-unknown || rustup target add wasm32-unknown-unknown; cargo build --release --target wasm32-unknown-unknown'

      - name: 校验构建产物
        run: |
          test -s target/wasm32-unknown-unknown/release/plugin.wasm || {
            echo "::error::缺少 target/wasm32-unknown-unknown/release/plugin.wasm"
            exit 1
          }
          ls -l target/wasm32-unknown-unknown/release/plugin.wasm

      # 官方黑盒契约校验(vendored 于 tools/conformance/, 来源见 tools/conformance/LOCAL-NOTES.md)。
      # 卡在签名之前: 校验最终 wasm 与 Federation 入口。市场条目版本按 package.mjs 的规则用 manifest 覆盖。
      - name: conformance 构包前校验
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.template.json", "utf8"));
            const e = JSON.parse(fs.readFileSync("market-entry.template.json", "utf8"));
            e.version = m.version;
            fs.writeFileSync("/tmp/dian-market-entry.json", JSON.stringify(e, null, 2));
          '
          rm -rf /tmp/dian-conf-build && mkdir -p /tmp/dian-conf-build/runtime /tmp/dian-conf-build/frontend/dist
          cp target/wasm32-unknown-unknown/release/plugin.wasm /tmp/dian-conf-build/runtime/plugin.wasm
          cp -r frontend/dist/. /tmp/dian-conf-build/frontend/dist/
          node ../../tools/conformance/project-check.mjs \
            --manifest manifest.template.json \
            --market /tmp/dian-market-entry.json \
            --build-root /tmp/dian-conf-build --require-build

      - name: 写入签名私钥
        env:
          SIGNING_KEY: ${{ secrets.DIAN115_PLUGIN_SIGNING_KEY }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "::error::未配置 Secrets.DIAN115_PLUGIN_SIGNING_KEY"; exit 1; }
          mkdir -p "$RUNNER_TEMP/dian115"
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/dian115/publisher.pem"
          chmod 600 "$RUNNER_TEMP/dian115/publisher.pem"

      - name: 打包并签名
        env:
          DIAN115_PLUGIN_SIGNING_KEY: ${{ runner.temp }}/dian115/publisher.pem
        run: node package.mjs

      - name: 清理私钥
        if: always()
        run: rm -f "$RUNNER_TEMP/dian115/publisher.pem"

      - name: 生成市场索引
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node build-market-index.mjs --repo="https://github.com/${{ github.repository }}" --tag="$TAG"

      - name: 创建 Release 并上传插件包
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          test -f "plugins/music-rs/releases/$PACKAGE" || {
            echo "::error::缺少预期包 $PACKAGE"
            ls -la plugins/music-rs/releases || true
            exit 1
          }
          gh release create "$TAG" "plugins/music-rs/releases/$PACKAGE" \
            --title "$TAG" \
            --notes "自动构建发布（音乐下载 Rust 版：无 sidecar，宿主代理下载两段式入库 + KV 任务队列 + Telegram 回调重试）。

          安装：DIAN115 插件中心 → 添加插件仓库 → https://github.com/${{ github.repository }}" \
            || gh release upload "$TAG" "plugins/music-rs/releases/$PACKAGE" --clobber

      - name: 回写市场索引到 main
        working-directory: .
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp plugin-market/index.json "$RUNNER_TEMP/index.json"
          mkdir -p "$RUNNER_TEMP/icons"
          cp -a plugin-market/icons/. "$RUNNER_TEMP/icons/"
          # 回写可能和人工/其它工作流的 push 撞车(non-fast-forward): 重取最新 main
          # 后重试, 最多 5 次(chase.rs 0.1.6 发布时被一次人工 commit 撞掉过)。
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -f -B main origin/main
            # 只把**本工作流发布的插件(music.rs)条目**覆盖进最新 main 的索引。
            # tag 树里保存的索引带着其它插件的旧版本, 若按 id 全量合并, 并发发布时
            # 后完成的回写会把兄弟插件刚回写的新条目打回旧版(chase-v0.1.8 三连发时
            # 就把 douban.rs 0.2.4 / music.rs 0.3.17 回退了)。其它条目一律以 main 为准。
            node -e '
              const fs = require("fs");
              const OWN = "music.rs";
              const fresh = JSON.parse(fs.readFileSync("plugin-market/index.json", "utf8"));
              const mine = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/index.json", "utf8"));
              const entry = mine.plugins.find(p => p.id === OWN);
              if (!entry) throw new Error("生成的索引里没有自己的条目 " + OWN);
              const i = fresh.plugins.findIndex(x => x.id === OWN);
              if (i >= 0) fresh.plugins[i] = entry; else fresh.plugins.push(entry);
              fs.writeFileSync("plugin-market/index.json", JSON.stringify(fresh, null, 2) + "\n");
            '
            cp -a "$RUNNER_TEMP/icons/." plugin-market/icons/
            git add plugin-market/index.json plugin-market/icons
            if git diff --cached --quiet; then
              echo "索引无变化"
              exit 0
            fi
            git commit -q -m "chore: 更新音乐下载 Rust 版市场索引 $TAG [skip ci]"
            if git push origin main; then
              echo "索引已回写(第 $attempt 次尝试)"
              exit 0
            fi
            echo "::warning::第 $attempt 次回写被拒(远端有新提交), 重试"
            sleep 5
          done
          echo "::error::市场索引回写失败: 连续 5 次被拒"
          exit 1
