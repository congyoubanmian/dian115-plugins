name: Release v3 plugins

# dian115 插件平台 v3 的打包与发布流水线（与旧插件 release-*.yml 互不影响）。
#
# - 推 `v3-*` 标签：拉官方 v3 套件 → 构建 UI（npm ci + npm run build，产物 v3/<plugin>/ui/）
#   → project-check → 打包三个 .dian115p → 校验 UI 产物可复现 + 包内无 node_modules →
#   创建/更新 Release（附包 + SHA256SUMS.txt + 更新后的市场索引）→
#   把 v3-market-index.json 的 source_url/sha256 回写 main（[skip ci]）。
# - 手动触发（workflow_dispatch）：只跑检查 + 打包 + 上传 artifact，不建 Release。
#
# 可选输入：ref（默认 workflow 触发时的 ref；手动触发时可指定分支/标签）。

on:
  push:
    tags:
      - 'v3-*'
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的 ref（默认当前分支）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # npm 缓存：缓存键由 v3-ui/package-lock.json 决定，锁文件不变就命中缓存。
          cache: npm
          cache-dependency-path: v3-ui/package-lock.json

      - name: Fetch dian115 v3 kit
        run: bash scripts/fetch-v3-kit.sh

      # ── 构建 UI（Vue 3）─────────────────────────────────────────────────
      # npm ci 严格按入库的 v3-ui/package-lock.json 安装（锁文件生效：不解析新版本，
      # 不改动锁文件）；npm run build 把 v3-ui/src/<plugin>/ 打成 v3/<plugin>/ui/page.js，
      # 也就是清单 ui.entry 指向、宿主直接 import 的那个文件。
      - name: 安装 UI 依赖（npm ci）
        working-directory: v3-ui
        run: npm ci

      - name: 构建 UI（npm run build → v3/<plugin>/ui/）
        working-directory: v3-ui
        run: npm run build

      # v3-build.sh 内部会再跑一次 scripts/v3-build-ui.sh（幂等，同样字节），
      # 然后才 project-check → pack：界面产物必须先于打包存在。
      - name: Build packages (project-check + pack + sha256)
        run: bash scripts/v3-build.sh

      # 产物是入库的，CI 必须能复现本地那份：重建结果与 git 里的版本不一致就报错
      # （源码改了没重建、或构建不可重复）。
      - name: 校验 UI 产物可复现（重建结果 == 入库版本）
        run: bash scripts/v3-verify-ui-artifacts.sh

      # 包里不能有 node_modules（依赖只装在构建机），清单入口必须齐全。
      - name: 检查包内容（不含 node_modules）
        run: |
          for pkg in dist/*.dian115p; do
            node scripts/v3-pack-check.mjs "$pkg"
          done

      - name: Prepare release files
        run: |
          mkdir -p release
          cp dist/*.dian115p release/
          (cd release && sha256sum *.dian115p | tee SHA256SUMS.txt)

      - name: Update market index for this tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node scripts/update-v3-index.mjs
          cp v3-market-index.release.json release/v3-market-index.json

      - name: Upload packages as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: v3-plugins-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "v3 插件 $TAG" \
              --notes-file release/SHA256SUMS.txt
          fi

      - name: Commit updated market index to main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp v3-market-index.release.json v3-market-index.json
          mkdir -p plugin-market/v3
          cp v3-market-index.release.json plugin-market/v3/index.json
          git add v3-market-index.json plugin-market/v3/index.json
          git commit -m "chore: 更新 v3 市场索引 $TAG [skip ci]" || echo "索引无变化，跳过提交"
          git push origin main
