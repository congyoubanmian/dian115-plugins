name: Release v3 plugins

# dian115 插件平台 v3 的打包与发布流水线（与旧插件 release-*.yml 互不影响）。
#
# - 本工作流只做**检查与可读调试包**：构建 UI（npm ci + npm run build，产物 v3/<plugin>/ui/）
#   → 离线单测 → 官方审查闸门 → project-check → 打包可读 .dian115p → 校验 UI 产物可复现
#   → 包内无 node_modules → 上传 artifact。
# - **正式发布不在 CI**：正式包是宿主「编译 MCP」签出的 protected-v4 包，需要可达的
#   DIAN115 实例与系统 OpenAPI Key，CI 拿不到；走 scripts/release-v3-local.sh。
#
# 可选输入：ref（默认 workflow 触发时的 ref；手动触发时可指定分支/标签）。

on:
  push:
    tags:
      - 'v3-*'
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的 ref（默认当前分支）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # npm 缓存：缓存键由 v3-ui/package-lock.json 决定，锁文件不变就命中缓存。
          cache: npm
          cache-dependency-path: v3-ui/package-lock.json

      - name: Fetch dian115 v3 kit
        run: bash scripts/fetch-v3-kit.sh

      # ── 离线单测（测试在 v3/tests/<plugin>/，不在插件目录里）──────────────
      - name: 离线单测
        run: bash scripts/v3-test.sh

      # ── 构建 UI（Vue 3）─────────────────────────────────────────────────
      # npm ci 严格按入库的 v3-ui/package-lock.json 安装（锁文件生效：不解析新版本，
      # 不改动锁文件）；npm run build 把 v3-ui/src/<plugin>/ 打成 v3/<plugin>/ui/page.js，
      # 也就是清单 ui.entry 指向、宿主直接 import 的那个文件。
      - name: 安装 UI 依赖（npm ci）
        working-directory: v3-ui
        run: npm ci

      - name: 构建 UI（npm run build → v3/<plugin>/ui/）
        working-directory: v3-ui
        run: npm run build

      # ── 构建 hghub UI（React 自打包，独立工作区）────────────────────────
      # v3/hghub-ui 有自己的锁文件；产物 v3/hghub/ui/page.js 同样入库。
      # （v3-build.sh 内部也会兜底跑一次 v3-build-ui.sh 的 hghub 步骤，幂等同样字节。）
      - name: 安装 hghub UI 依赖（npm ci）
        working-directory: v3/hghub-ui
        run: npm ci

      - name: 构建 hghub UI（npm run build → v3/hghub/ui/）
        working-directory: v3/hghub-ui
        run: npm run build

      # v3-build.sh 内部会再跑一次 scripts/v3-build-ui.sh（幂等，同样字节），
      # 然后先过官方审查闸门（结构 + 恶意特征扫描，critical/high 必须在
      # scripts/v3-audit-allowlist.json 里登记过误报理由），再 project-check → pack：
      # 界面产物必须先于打包存在。
      - name: Build packages (audit + project-check + pack + sha256)
        run: bash scripts/v3-build.sh

      # 产物是入库的，CI 必须能复现本地那份：重建结果与 git 里的版本不一致就报错
      # （源码改了没重建、或构建不可重复）。
      - name: 校验 UI 产物可复现（重建结果 == 入库版本）
        run: bash scripts/v3-verify-ui-artifacts.sh

      # 包里不能有 node_modules（依赖只装在构建机），清单入口必须齐全。
      - name: 检查包内容（不含 node_modules）
        run: |
          for pkg in dist/*.dian115p; do
            node scripts/v3-pack-check.mjs "$pkg"
          done

      # 正式包（protected-v4）只能由开发者本机的编译 MCP 签发（需可达的 DIAN115 实例 +
      # 系统 OpenAPI Key），CI 拿不到这些凭据，因此这里只产出**可读源码包**作为本机调试用
      # 产物上传成 artifact；正式发布走 scripts/release-v3-local.sh。
      - name: Prepare debug packages (可读源码包，仅本机调试用)
        run: |
          mkdir -p release
          cp dist/*.dian115p release/
          (cd release && sha256sum *.dian115p | tee SHA256SUMS.txt)

      - name: Upload debug packages as artifact
        uses: actions/upload-artifact@v4
        with:
          name: v3-plugins-debug-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
