version: 2

updates:
  # GitHub Actions used by repository workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # npm: v3-ui（三个 v3 插件的 Vue 3 界面与构建底座）
  - package-ecosystem: "npm"
    directory: "/v3-ui"
    schedule:
      interval: "weekly"
    groups:
      npm-all:
        patterns:
          - "*"
